function timeline(o){return '<div class="order-timeline">'+STAGES.map(function(s,i){return '<div class="milestone '+(i<o.stage?'done':i===o.stage?'current':'')+'"><span class="dot" aria-hidden="true">'+(i<o.stage?'✓':i+1)+'</span><div><strong>'+s+'</strong><small>'+(i<o.stage?'Etapa ilustrativa concluída':i===o.stage?'Etapa atual da simulação':'Próxima etapa')+'</small></div></div>'}).join('')+'</div>'}
function client(){var o=data.orders.find(function(x){return x.id===chosenId})||data.orders[0];return '<section class="hero"><div class="wrap hero-grid"><div class="hero-copy"><div class="pill">Cosplays sob medida • apresentação conceito</div><h1>'+esc(data.config.headline).replace(/(cosplay|Cosplay)/g,'<em>$1</em>')+'</h1><p>'+esc(data.config.note)+'</p><div class="row buttons"><button class="button primary" data-action="quote">Solicitar orçamento <span aria-hidden="true">↗</span></button><button class="button secondary" data-action="track">Acompanhar exemplo</button></div><p style="font-size:.73rem;margin:23px 0 0"><span aria-hidden="true">✦</span> '+esc(data.config.agenda)+' · frete e prazos a confirmar diretamente com a loja</p></div>'+art()+'</div></section><section class="section" id="colecao"><div class="wrap"><div class="section-title"><span class="eyebrow">O ateliê dos seus personagens</span><h2>Uma ideia, infinitas possibilidades.</h2><p>Escolha o tipo de peça e conte a sua ideia. Estes modelos são ilustrativos, não um catálogo real nem preços da loja.</p></div><div class="cards">'+product(0,'Uniformes & conjuntos','Golas, laços, saias e detalhes que dão vida ao visual.','Uniforme')+product(1,'Vestidos & figurinos','Modelagens, tecidos e acabamentos pensados para o seu projeto.','Vestido')+product(2,'Capas & acessórios','Peças especiais para compor um cosplay completo.','Acessório')+'</div></div></section><section class="section muted"><div class="wrap"><div class="section-title"><span class="eyebrow">Como seria encomendar</span><h2>Do primeiro desenho ao último detalhe.</h2></div><div class="steps"><div class="step"><span class="stepnum">01</span><h3>Conte o seu projeto</h3><p>Envie o personagem, o tipo de peça e uma descrição do que imagina.</p></div><div class="step"><span class="stepnum">02</span><h3>Alinhe seu orçamento</h3><p>O ateliê analisa medidas, materiais, referências e viabilidade.</p></div><div class="step"><span class="stepnum">03</span><h3>Acompanhe as etapas</h3><p>Visualize a evolução da peça e os próximos passos em um só lugar.</p></div></div></div></section><section class="section" id="solicitar"><div class="wrap split"><div><span class="eyebrow">Uma solicitação mais simples</span><h2>Vamos dar forma à sua ideia?</h2><p style="color:#807087;max-width:400px">Experimente um formulário curto. Ele gera uma solicitação fictícia no seu navegador para você visualizar o funcionamento sem enviar nada à loja.</p><div class="alert">✦ Esta experiência é apenas uma demonstração. Não envie dados pessoais reais, medidas corporais ou informações confidenciais.</div></div><div class="panel">'+(flash?'<p class="alert success" role="status">'+esc(flash)+'</p>':'')+(quoteOpen?'<form id="quote-form"><h3>Meu cosplay dos sonhos ✨</h3><p>Preencha somente com informações de exemplo.</p><div class="form-grid"><div class="field"><label for="alias">Apelido de exemplo *</label><input id="alias" name="alias" maxlength="32" required placeholder="Ex.: Luna"></div><div class="field"><label for="kind">Tipo de peça *</label><select id="kind" name="kind" required><option value="">Selecione</option><option>Uniforme</option><option>Vestido</option><option>Acessório</option><option>Cosplay completo</option></select></div></div><div class="field"><label for="character">Personagem / peça desejada *</label><input id="character" name="character" maxlength="70" required placeholder="Ex.: uniformes de academia"></div><div class="form-grid"><div class="field"><label for="universe">Obra de referência</label><input id="universe" name="universe" maxlength="60" placeholder="Anime, jogo ou original"></div><div class="field"><label for="deadline">Prazo desejado</label><input id="deadline" name="deadline" maxlength="45" placeholder="Ex.: sem data definida"></div></div><div class="field"><label for="details">Detalhes da ideia</label><textarea id="details" name="details" maxlength="500" placeholder="Cores, tecidos, referências e preferências de exemplo..."></textarea></div><button type="submit" class="button primary">Criar solicitação demo ↗</button><button type="button" class="button plain" data-action="closeQuote">Cancelar</button></form>':'<h3>Um pedido começa com uma ideia</h3><p>Nenhum cadastro obrigatório e nenhum pagamento nesta prévia.</p><button class="button primary" data-action="quote">Montar meu pedido demonstrativo ↗</button>')+'</div></div></section><section class="section muted" id="acompanhar"><div class="wrap split"><div><span class="eyebrow">Acompanhamento de confecção</span><h2>Seu cosplay, passo a passo.</h2><p style="color:#807087">Uma linha do tempo permite saber em qual etapa a peça está. Teste a atualização na aba <b>Ateliê</b> e volte aqui para ver a mudança.</p><div class="field" style="max-width:350px"><label for="order-pick">Escolha um pedido fictício</label><select id="order-pick">'+data.orders.map(function(x){return '<option value="'+esc(x.id)+'" '+(x.id===o.id?'selected':'')+'>'+esc(x.id)+' — '+esc(x.character)+'</option>'}).join('')+'</select></div></div><div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">Acompanhamento demo</span><span class="order-code">'+esc(o.id)+'</span></div><h3 style="margin:15px 0 4px">'+esc(o.character)+'</h3><p style="margin-bottom:0">Para '+esc(o.name)+'</p>'+timeline(o)+'</div></div></section><section class="section"><div class="wrap"><div class="callout"><div><h3>Seu ateliê merece uma experiência à altura.</h3><p>Veja também como funcionariam os bastidores deste sistema.</p></div><button class="button primary" data-go="atelier">Explorar ateliê ↗</button></div></div></section>'}
function dashboardHeader(kind){return '<section class="dashboard-head"><div class="wrap"><span class="eyebrow">Área interna • somente demonstração</span><h1>'+(kind==='atelier'?'Cada ponto no seu lugar.':'Seu ateliê em perspectiva.')+'</h1><p>'+(kind==='atelier'?'Acompanhe solicitações e avance as etapas de confecção sem perder o fio.':'Organize a vitrine, a agenda comunicada e as encomendas simuladas.')+'</p></div></section>'}
function counts(){return '<div class="stats"><div class="stat"><span>Solicitações demo</span><strong>'+data.orders.length+'</strong></div><div class="stat"><span>Em análise</span><strong>'+itemCount(1)+'</strong></div><div class="stat"><span>Na produção</span><strong>'+(itemCount(2)+itemCount(3))+'</strong></div></div>'}
function staff(){return dashboardHeader('atelier')+'<div class="wrap dash">'+counts()+'<div class="two-col"><div><div class="row" style="justify-content:space-between"><h3>Fila de confecção</h3><span class="tag">Dados ilustrativos</span></div><div class="stack">'+data.orders.map(function(o){return '<article class="order-card"><div><span class="order-code">'+esc(o.id)+'</span><h3 style="margin:4px 0">'+esc(o.character)+'</h3><p>'+esc(o.name)+' · '+esc(o.type)+'</p><span class="tag">'+esc(STAGES[o.stage])+'</span></div><div class="row"><button class="mini" data-prev="'+esc(o.id)+'" '+(o.stage===0?'disabled':'')+' aria-label="Voltar uma etapa de '+esc(o.id)+'">← Voltar</button><button class="mini filled" data-next="'+esc(o.id)+'" '+(o.stage===STAGES.length-1?'disabled':'')+' aria-label="Avançar uma etapa de '+esc(o.id)+'">Avançar →</button></div></article>'}).join('')+'</div></div><aside class="panel"><span class="eyebrow">Rotina simplificada</span><h3 style="margin-top:12px">Uma produção mais visível</h3><p>O ateliê atualiza o andamento e o acompanhamento do cliente reflete a mudança neste mesmo navegador.</p><div class="divider"></div><h3>Etapas propostas</h3>'+STAGES.map(function(s,i){return '<p style="font-size:.83rem;margin:12px 0">'+(i+1)+'. '+esc(s)+'</p>'}).join('')+'<div class="alert">Nenhum pedido é enviado, atualizado ou sincronizado com a Gojo real.</div><button style="margin-top:18px" class="button secondary" data-go="cliente">Ver como cliente ↗</button></aside></div></div>'}
function manager(){return dashboardHeader('gestao')+'<div class="wrap dash">'+counts()+'<div class="two-col"><div class="panel"><span class="eyebrow">Personalização da vitrine</span><h3 style="margin-top:10px">O primeiro contato com sua marca</h3><p>Edite informações de demonstração e veja as alterações aparecerem na vitrine.</p><form id="settings-form"><div class="field"><label for="headline">Chamada principal</label><input id="headline" name="headline" required maxlength="85" value="'+esc(data.config.headline)+'"></div><div class="field"><label for="agenda">Mensagem de agenda</label><input id="agenda" name="agenda" maxlength="85" value="'+esc(data.config.agenda)+'"></div><div class="field"><label for="note">Texto de apresentação</label><textarea id="note" name="note" maxlength="240">'+esc(data.config.note)+'</textarea></div><button class="button primary" type="submit">Salvar alterações demonstrativas</button></form><div class="divider"></div><button class="mini" data-action="reset">Reiniciar toda a demo ↺</button></div><div class="stack"><div class="panel"><span class="eyebrow">Teste imediato</span><h3 style="margin-top:10px">Veja o resultado</h3><p>Os textos alterados são usados diretamente no início da vitrine.</p><button class="button secondary" data-go="cliente">Abrir vitrine ↗</button></div><div class="panel"><span class="eyebrow">Organização de solicitações</span><h3 style="margin-top:10px">Fluxo do ateliê</h3>'+STAGES.map(function(s,i){return '<div class="row" style="justify-content:space-between;border-bottom:1px solid #eee5f1;padding:11px 0"><span style="font-size:.8rem">'+esc(s)+'</span><span class="tag">'+itemCount(i)+'</span></div>'}).join('')+'<button style="margin-top:17px" class="button secondary" data-go="atelier">Gerenciar etapas ↗</button></div><div class="alert">Sandbox local: alterações são ilustrativas, ficam neste navegador e não acessam dados da loja.</div></div></div></div>'}
function getView(){return new URLSearchParams(location.search).get('view')||'cliente'}
function navigate(v){if(['cliente','atelier','gestao'].indexOf(v)<0)v='cliente';history.pushState({},'', '?view='+v);render();window.scrollTo(0,0)}
function render(){var v=getView();document.querySelectorAll('[data-view]').forEach(function(a){if(a.dataset.view===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('page').innerHTML=v==='atelier'?staff():v==='gestao'?manager():client();document.title=(v==='atelier'?'Ateliê':v==='gestao'?'Gestão':'Vitrine')+' · Gojo Cosmaker — Demo';}
document.addEventListener('click',function(e){var target=e.target.closest('[data-view],[data-go],[data-action],[data-start],[data-next],[data-prev]');if(!target)return;if(target.dataset.view){e.preventDefault();navigate(target.dataset.view);return}if(target.dataset.go){navigate(target.dataset.go);return}if(target.dataset.start){quoteOpen=true;flash='';navigate('cliente');document.querySelector('#solicitar').scrollIntoView({behavior:'smooth'});var input=document.getElementById('kind');if(input)input.value=target.dataset.start;return}if(target.dataset.next||target.dataset.prev){var id=target.dataset.next||target.dataset.prev;var o=data.orders.find(function(x){return x.id===id});if(o){o.stage=Math.max(0,Math.min(4,o.stage+(target.dataset.next?1:-1)));save();render()}return}if(target.dataset.action==='quote'){quoteOpen=true;flash='';render();document.getElementById('solicitar').scrollIntoView({behavior:'smooth'});setTimeout(function(){var a=document.getElementById('alias');if(a)a.focus({preventScroll:true})},100);return}if(target.dataset.action==='closeQuote'){quoteOpen=false;render();document.getElementById('solicitar').scrollIntoView();return}if(target.dataset.action==='track'){document.getElementById('acompanhar').scrollIntoView({behavior:'smooth'});return}if(target.dataset.action==='reset'){if(!confirm('Reiniciar os dados fictícios desta demonstração neste navegador?'))return;data=clone(example);chosenId='GOJO-2406';quoteOpen=false;save();render();return}});
document.addEventListener('submit',function(e){if(e.target.id==='quote-form'){e.preventDefault();var f=new FormData(e.target);var id='GOJO-'+String(Math.floor(1000+Math.random()*8999));while(data.orders.some(function(x){return x.id===id})){id='GOJO-'+String(Math.floor(1000+Math.random()*8999))}data.orders.unshift({id:id,name:String(f.get('alias')||'').trim().slice(0,32),type:String(f.get('kind')||'').trim(),character:String(f.get('character')||'').trim().slice(0,70),universe:String(f.get('universe')||'').trim().slice(0,60),deadline:String(f.get('deadline')||'').trim().slice(0,45),details:String(f.get('details')||'').trim().slice(0,500),stage:0,created:'Criado nesta demonstração'});chosenId=id;quoteOpen=false;save();flash='Solicitação demonstrativa '+id+' criada neste navegador! Confira o acompanhamento abaixo.';render();document.querySelector('#solicitar').scrollIntoView({behavior:'smooth'});return}if(e.target.id==='settings-form'){e.preventDefault();var s=new FormData(e.target);data.config={headline:String(s.get('headline')||'').trim().slice(0,85),agenda:String(s.get('agenda')||'').trim().slice(0,85),note:String(s.get('note')||'').trim().slice(0,240)};save();render();var a=document.createElement('p');a.className='alert success';a.setAttribute('role','status');a.textContent='Textos atualizados neste navegador. Confira na vitrine!';document.querySelector('#settings-form').after(a)}});
document.addEventListener('change',function(e){if(e.target.id==='order-pick'){chosenId=e.target.value;render();document.getElementById('acompanhar').scrollIntoView()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&quoteOpen){quoteOpen=false;render()}});
window.addEventListener('popstate',render);
render();
})();
</script>
