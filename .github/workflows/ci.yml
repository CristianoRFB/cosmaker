name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run functions:build
      - run: npm run build
      - run: npm test -- --run
      - run: npm run test:operations
      - run: npm run docs:functional
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix infrastructure/spark
      - run: npm --prefix infrastructure/spark test
      - run: node infrastructure/spark/run-integration.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
  windows-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate operational tools and PowerShell runbooks with synthetic fixtures only
        shell: pwsh
        run: npm run test:operations
      - run: npm ci --prefix infrastructure/spark
      - name: Validate isolated Workers guards and runtime on Windows
        shell: pwsh
        run: npm --prefix infrastructure/spark test
        env:
          WRANGLER_SEND_METRICS: 'false'
