name: CI
on: [push, pull_request]
jobs:
  verify:
    if: github.ref_name != 'codex/cosmaker-goal-vii-media-lifecycle' && github.head_ref != 'codex/cosmaker-goal-vii-media-lifecycle' && github.ref_name != 'codex/cosmaker-goal-viii-capacidade-free' && github.head_ref != 'codex/cosmaker-goal-viii-capacidade-free'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run functions:build
      - run: npm run build
      - run: npm test -- --run
      - run: npm run test:operations
      - run: npm run docs:functional
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix infrastructure/spark
      - run: npm --prefix infrastructure/spark test
      - run: node infrastructure/spark/run-integration.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
  windows-preflight:
    if: github.ref_name != 'codex/cosmaker-goal-vii-media-lifecycle' && github.head_ref != 'codex/cosmaker-goal-vii-media-lifecycle' && github.ref_name != 'codex/cosmaker-goal-viii-capacidade-free' && github.head_ref != 'codex/cosmaker-goal-viii-capacidade-free'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate operational tools and PowerShell runbooks with synthetic fixtures only
        shell: pwsh
        run: npm run test:operations
      - run: npm ci --prefix infrastructure/spark
      - name: Validate isolated Workers guards and runtime on Windows
        shell: pwsh
        run: npm --prefix infrastructure/spark test
        env:
          WRANGLER_SEND_METRICS: 'false'
  media-proof:
    if: github.ref_name == 'codex/cosmaker-goal-vii-media-lifecycle' || github.head_ref == 'codex/cosmaker-goal-vii-media-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix infrastructure/spark
      - run: npm ci --prefix infrastructure/media
      - run: npm --prefix infrastructure/media test
      - run: node infrastructure/media/run-integration.mjs
      - run: npx eslint app/api/media-proof tests/e2e/media-lifecycle.spec.ts
      - run: npm run build:local
      - run: npx playwright install --with-deps chromium
      - run: node infrastructure/media/run-integration.mjs ui
      - run: npm run docs:functional
      - run: npm audit --prefix infrastructure/media --audit-level=high
  media-native-storage:
    if: github.ref_name == 'codex/cosmaker-goal-vii-media-lifecycle' || github.head_ref == 'codex/cosmaker-goal-vii-media-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Official Storage OSS containers only, synthetic private 20 MiB proof
        run: node infrastructure/media/run-native.mjs
  media-windows:
    if: github.ref_name == 'codex/cosmaker-goal-vii-media-lifecycle' || github.head_ref == 'codex/cosmaker-goal-vii-media-lifecycle'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix infrastructure/media
      - run: npm --prefix infrastructure/media test

  free-capacity:
    if: github.ref_name == 'codex/cosmaker-goal-viii-capacidade-free' || github.head_ref == 'codex/cosmaker-goal-viii-capacidade-free'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix infrastructure/feasibility
      - run: npm --prefix infrastructure/feasibility test
      - run: node infrastructure/feasibility/simulate.mjs
      - run: git diff --exit-code -- docs/implementation/capacity-free/SCENARIOS.json docs/implementation/capacity-free/SCENARIOS.csv
  free-runtime:
    if: github.ref_name == 'codex/cosmaker-goal-viii-capacidade-free' || github.head_ref == 'codex/cosmaker-goal-viii-capacidade-free'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix infrastructure/spark
      - run: node infrastructure/feasibility/run-runtime.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
