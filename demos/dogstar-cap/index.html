function custom(){var c=item(selected);return '<div class="page-top"><div><button class="back" data-action="home">← Voltar para a vitrine</button><div class="eyebrow">Seu boné, sua ideia</div><h1 class="page-title">MONTE SEU BRIEFING.</h1><p>Um primeiro passo simples para transformar uma referência em pedido. Não envia informações para nenhuma loja.</p></div><span class="tag dark">Simulação interativa</span></div><div class="config-layout"><form id="orderForm" class="panel"><div class="field"><label for="collection">01 / Inspiração</label><select id="collection" name="collection">'+collections.map(function(x){return '<option value="'+x.id+'" '+(x.id===selected?'selected':'')+'>'+esc(x.title)+'</option>'}).join('')+'</select></div><div class="field"><span>02 / Cor base (ilustrativa)</span><div class="swatches" role="group" aria-label="Cor do boné">'+[['#111316','Preto'],['#f4f0e7','Areia'],['#ed694e','Coral'],['#405e85','Azul'],['#e6d777','Amarelo']].map(function(x){return '<button type="button" class="swatch" style="background:'+x[0]+'" aria-label="'+x[1]+'" aria-pressed="'+(x[0]===selectedColor)+'" data-action="color" data-color="'+x[0]+'"></button>'}).join('')+'</div></div><div class="field"><label for="note">03 / Sua ideia ou referência <small>(opcional)</small></label><textarea id="note" name="note" maxlength="240" placeholder="Ex.: tema, personagem ou detalhes desejados. Não informe dados pessoais."></textarea><small>Até 240 caracteres. Apenas para a simulação neste dispositivo.</small></div><div class="notice" style="margin-bottom:20px">Não é um pedido real. Nenhuma mensagem é enviada e não há cobrança, orçamento definitivo ou fabricação.</div><button class="btn dark" type="submit" style="width:100%">Simular solicitação ↗</button></form><aside class="preview"><span class="eyebrow">Prévia conceitual</span><div class="preview-image" id="capPreview">'+cap(selectedColor,c.symbol)+'</div><h3 id="previewTitle">'+esc(c.title)+'</h3><p>O desenho do boné é uma ilustração de exemplo, não um mockup de produção aprovado.</p><span class="tag dark">Preço a definir com a loja</span></aside></div>'}
function done(){var o=data.orders.find(function(x){return x.id===data.last});if(!o){mode='home';return store()}var now=Math.min(4,Math.max(0,Number(o.stage)||0));return '<div class="page-top"><div><button class="back" data-action="home">← Explorar mais estilos</button><div class="eyebrow">Rastreamento ilustrativo</div><h1 class="page-title">SUA IDEIA TEM CAMINHO.</h1></div></div><div class="panel" style="max-width:810px;margin:auto"><div class="success-top"><div class="success-icon" aria-hidden="true">✓</div><div><div class="eyebrow">Simulação criada neste navegador</div><h2 style="margin:4px 0;font-size:25px">'+esc(o.id)+'</h2></div></div><p style="color:var(--gray);font-size:13px;margin-top:15px">Exemplo de encomenda: '+esc(item(o.collection).title)+'. Etapa atual: <strong>'+esc(stages[now])+'</strong>.</p><div class="status-track">'+stages.map(function(s,i){return '<div class="status-item '+(i<=now?'done ':'')+(i===now?'current':'')+'"><div class="status-dot">'+(i<=now?'✓':'·')+'</div>'+esc(s)+'</div>'}).join('')+'</div><div class="notice">Acompanhe a simulação pela aba Produção. As mudanças são salvas apenas neste navegador. A Dogstar não recebe dados.</div><div class="actions"><button class="btn dark" data-view="atelier" data-action="nav" data-target="atelier">Ver a produção ↗</button><button class="btn soft" data-action="reset">Reiniciar exemplo</button></div></div>'}
function atelier(){return '<div class="page-top"><div><div class="eyebrow">02 / Fluxo da equipe</div><h1 class="page-title">O ATELIÊ, ORGANIZADO.</h1><p>Uma fila simples de encomendas: entender a ideia, revisar a arte, aprovar e produzir. Toque em avançar para acompanhar uma movimentação.</p></div><span class="tag dark">Painel de treinamento • sem login real</span></div><div class="notice" style="margin:0 0 24px">Pedidos fictícios e etapas locais. Este painel é público apenas como demonstração; não é um administrativo verdadeiro.</div><div class="board" aria-label="Quadro de andamento dos pedidos de exemplo">'+stages.map(function(stage,i){var orders=data.orders.filter(function(o){return Number(o.stage)===i});return '<section class="lane"><div class="lane-head"><span>'+esc(stage)+'</span><span class="count">'+orders.length+'</span></div>'+(orders.length?orders.map(function(o){return '<article class="ticket"><div class="ticket-label">'+esc(o.id)+'</div><strong>'+esc(item(o.collection).title)+'</strong><p>'+esc(o.note||'Briefing sem observações')+'</p>'+(i<4?'<button data-action="advance" data-id="'+esc(o.id)+'">Avançar etapa →</button>':'<span class="tag yellow">Finalizado ✓</span>')+'</article>'}).join(''):'<div class="empty">Nenhum pedido nesta etapa</div>')+'</section>'}).join('')+'</div><div class="actions"><button class="btn soft" data-action="reset">Restaurar dados de exemplo</button><button class="btn dark" data-view="gestao" data-action="nav" data-target="gestao">Ver visão do gestor →</button></div>'}
function gestao(){var total=data.orders.length,creation=data.orders.filter(function(o){return o.stage===1||o.stage===2}).length,doing=data.orders.filter(function(o){return o.stage===3}).length,ready=data.orders.filter(function(o){return o.stage===4}).length;var counts=collections.map(function(c){return {title:c.title,count:data.orders.filter(function(o){return o.collection===c.id}).length}});var mx=Math.max(1,...counts.map(function(c){return c.count}));return '<div class="page-top"><div><div class="eyebrow">03 / Visão do proprietário</div><h1 class="page-title">VISÃO CLARA. SEM ACHISMO.</h1><p>Exemplo de operação focado em andamento de pedidos e temas solicitados. Não exibe faturamento nem métricas reais.</p></div><span class="tag dark">Indicadores dos pedidos fictícios</span></div><div class="metric-grid"><div class="metric"><strong>'+total+'</strong><span>Pedidos demonstrativos</span></div><div class="metric"><strong>'+creation+'</strong><span>Arte ou aprovação</span></div><div class="metric"><strong>'+doing+'</strong><span>Em produção</span></div><div class="metric"><strong>'+ready+'</strong><span>Prontos</span></div></div><div class="insight-grid"><section class="panel"><div class="eyebrow">Demanda ilustrativa</div><h2 style="font-size:23px;letter-spacing:-.04em;margin:8px 0 22px">Temas solicitados</h2>'+counts.map(function(c){return '<div class="bar-row"><div class="bar-label"><span>'+esc(c.title)+'</span><span>'+c.count+'</span></div><div class="bar-bg"><div class="bar-fill" style="width:'+(c.count/mx*100)+'%"></div></div></div>'}).join('')+'<p style="font-size:11px;color:var(--gray);margin-top:23px">Contagens calculadas sobre exemplos locais, sem dados comerciais.</p></section><section class="panel"><div class="eyebrow">Preferências de vitrine · simulação</div><h2 style="font-size:23px;letter-spacing:-.04em;margin:8px 0 15px">Controles para testar</h2>'+[['catalog','Mostrar inspirações','Estrutura de coleções na página cliente'],['custom','Permitir briefing','Simulação de encomenda sem checkout'],['tracking','Acompanhamento visual','Etapas ilustrativas para o visitante']].map(function(x){return '<div class="setting"><div><strong>'+x[1]+'</strong><p>'+x[2]+'</p></div><button class="toggle" data-action="toggle" data-key="'+x[0]+'" aria-pressed="'+Boolean(data.settings[x[0]])+'" aria-label="'+x[1]+'"></button></div>'}).join('')+'<p style="font-size:11px;color:var(--gray);margin:15px 0 0">Controles locais, sem alterar sistemas ou catálogo da Dogstar.</p></section></div><div class="actions"><button class="btn dark" data-view="atelier" data-action="nav" data-target="atelier">Abrir fila de produção →</button><button class="btn soft" data-action="reset">Restaurar demonstração</button></div>'}
function goto(view){page=view;mode='home';history.pushState({},'',location.pathname+'?view='+view);render()}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-action],[data-view]');if(!b)return;if(b.dataset.action==='nav'){goto(b.dataset.target);return}if(b.dataset.view&&!b.dataset.action){goto(b.dataset.view);return}var a=b.dataset.action;if(a==='home'){mode='home';render()}if(a==='track'&&data.last){mode='done';render()}if(a==='custom'||a==='choose'){selected=b.dataset.id||'epica';mode='custom';render()}if(a==='color'){selectedColor=b.dataset.color;document.querySelectorAll('.swatch').forEach(function(el){el.setAttribute('aria-pressed',String(el===b))});document.getElementById('capPreview').innerHTML=cap(selectedColor,item(selected).symbol)}if(a==='advance'){var o=data.orders.find(function(x){return x.id===b.dataset.id});if(o&&o.stage<4){o.stage++;save();render()}}if(a==='toggle'){var k=b.dataset.key;data.settings[k]=!data.settings[k];save();render()}if(a==='reset'){data={orders:seed.map(function(x){return Object.assign({},x)}),settings:{catalog:true,custom:true,tracking:true},last:null};save();mode='home';render()}});
document.addEventListener('change',function(e){if(e.target.id==='collection'){selected=e.target.value;document.getElementById('previewTitle').textContent=item(selected).title;document.getElementById('capPreview').innerHTML=cap(selectedColor,item(selected).symbol)}});
document.addEventListener('submit',function(e){if(e.target.id!=='orderForm')return;e.preventDefault();var f=e.target;selected=f.elements.collection.value;var note=String(f.elements.note.value||'').trim().slice(0,240);var num=String(Math.max(45,...data.orders.map(function(o){return Number((o.id.match(/(\d+)$/)||[])[1])||0}))+1).padStart(3,'0');var id='DS-DEMO-'+num;data.orders.push({id:id,collection:selected,color:selectedColor,note:note||'Personalização conceitual',stage:0});data.last=id;save();mode='done';render()});
window.addEventListener('popstate',function(){page=new URLSearchParams(location.search).get('view')||'loja';mode='home';render()});render();
})();
</script></body></html>
