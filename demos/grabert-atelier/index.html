function productCard(p){return '<article class="item"><div class="item-art art-'+p.art+'">'+svg(p.art)+'<span class="cat">'+esc(p.cat)+'</span></div><div class="item-body"><h3>'+esc(p.title)+'</h3><p>'+esc(p.desc)+'</p><div class="item-bottom"><span>Orçamento personalizado</span><button data-action="request" data-item="'+p.id+'">Quero um parecido ↗</button></div></div></article>'}
function client(){
var list=products.filter(function(p){return state.visible.indexOf(p.id)>=0&&(filter==="Todos"||p.cat===filter)});
var last=state.orders.find(function(o){return o.id===state.last});
return '<main><section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Cada personagem merece ganhar vida</div><h1>Suas ideias.<br><span class="serif">Feitas à mão.</span></h1><p class="lead">Um espaço para transformar referências em figurinos, perucas e acessórios especiais — com cada detalhe pensado para o seu próximo cosplay.</p><div class="hero-actions"><button class="btn primary" data-action="request">Solicitar orçamento <span aria-hidden="true">↗</span></button><a class="btn secondary" href="#colecao">Explorar criações ↓</a></div><div class="stats-row"><div class="stat-item"><strong>Projeto sob medida</strong><span>Você apresenta a referência e o objetivo.</span></div><div class="stat-item"><strong>Etapas claras</strong><span>Saiba como a ideia chega à entrega.</span></div><div class="stat-item"><strong>Conversa próxima</strong><span>Briefing simples e sem formulários longos.</span></div></div></div><div class="hero-art"><span class="hero-no">01 / Imaginar & criar</span><div class="sculpt">'+svg("costume")+'</div><div class="corner-note"><strong>Da referência ao detalhe</strong><span>Conceito visual ilustrativo • peça fictícia</span></div></div></div></section>'+(last?'<section class="wrap"><div class="tracking"><span class="eyebrow">Acompanhamento demonstrativo</span><h3>Seu pedido de exemplo '+esc(last.id)+'</h3><p class="muted">'+esc(last.item)+' — '+esc(stages[last.stage])+'</p><div class="line">'+stages.map(function(s,i){return '<span class="'+(i<=last.stage?"done":"")+'">'+(i+1)+'. '+s+'</span>'}).join("")+'</div><div style="margin-top:15px" class="muted">Simulação local: nenhuma mensagem ou arquivo foi enviado ao ateliê.</div></div></section>':"")+'<section id="colecao" class="section"><div class="wrap"><div class="section-head"><div><span class="eyebrow">Universo de possibilidades</span><h2>Criações que contam<br><span class="serif">histórias.</span></h2></div><p>Perucas estilizadas, figurinos e adereços: algumas formas de dar vida à sua ideia.</p></div><div class="filters" role="group" aria-label="Filtrar criações">'+["Todos"].concat(cats).map(function(c){return '<button class="chip '+(filter===c?"active":"")+'" data-filter="'+c+'" aria-pressed="'+(filter===c)+'">'+c+'</button>'}).join("")+'</div><div class="collection">'+(list.length?list.map(productCard).join(""):'<div class="empty">Nenhum exemplo nesta categoria. Na gestão, é possível reativar opções.</div>')+'</div></div></section><section class="section" style="background:#1c1829"><div class="wrap"><span class="eyebrow">Como funcionaria</span><h2>Um processo <span class="serif">sem mistério.</span></h2><div class="steps"><article class="step"><div class="step-number">01</div><h3>Conte sua ideia</h3><p>Escolha a categoria, descreva o personagem ou conceito e o que precisa.</p></article><article class="step"><div class="step-number">02</div><h3>Receba um orçamento</h3><p>O ateliê analisa referências, materiais e prazo e responde com uma proposta.</p></article><article class="step"><div class="step-number">03</div><h3>Acompanhe a criação</h3><p>O andamento fica organizado, da aprovação ao acabamento final.</p></article></div></div></section><section class="section"><div class="wrap"><div class="feature-band"><div><span class="tiny">Sua próxima criação começa aqui</span><h2>Tem uma ideia em mente?</h2><p>Envie um briefing de exemplo e veja como uma solicitação entraria no painel do ateliê.</p></div><button class="btn" data-action="request">Montar meu pedido de exemplo ↗</button></div></div></section></main>'
}
function badge(stage){return '<span class="pill '+(stage===0?"novo":stage===2?"producao":stage===4?"finalizado":"")+'">'+esc(stages[stage])+'</span>'}
function orderRow(o){return '<div class="list-row"><div><strong>'+esc(o.item)+'</strong><small>'+esc(o.id)+' · '+esc(o.name)+' · '+dateBR(o.date)+'</small></div><div class="order-actions">'+badge(o.stage)+'<button class="btn sm secondary" data-order="'+esc(o.id)+'">Detalhes</button>'+(o.stage<4?'<button class="btn sm violet" data-advance="'+esc(o.id)+'">Avançar →</button>':"")+'</div></div>'}
function atelier(){
var active=state.orders.filter(function(o){return o.stage<4}).length;
return '<main class="dash"><div class="wrap"><div class="dash-title"><div><span class="eyebrow">Visão da equipe • Demo</span><h1>Produção <span class="serif">em movimento.</span></h1><p class="subcopy">Uma fila de trabalho organizada para que cada encomenda tenha contexto, prioridade e andamento visível. Tudo abaixo é fictício.</p></div><button class="btn primary" data-action="request">+ Nova solicitação</button></div><div class="metrics"><div class="metric"><span>Em andamento</span><strong>'+active+'</strong><small>Exemplos de produção</small></div><div class="metric"><span>Novas solicitações</span><strong>'+state.orders.filter(function(o){return o.stage===0}).length+'</strong><small>Aguardando análise</small></div><div class="metric"><span>Em execução</span><strong>'+state.orders.filter(function(o){return o.stage===2}).length+'</strong><small>Peças em criação</small></div><div class="metric"><span>Finalizados</span><strong>'+state.orders.filter(function(o){return o.stage===4}).length+'</strong><small>Concluídos na demo</small></div></div><div class="section-head"><div><h2 style="font-size:35px">Quadro de encomendas</h2><p>Avance cada pedido para simular o acompanhamento do trabalho.</p></div><span class="tag">DADOS DE EXEMPLO • ARMAZENAMENTO LOCAL</span></div><div class="board">'+stages.slice(0,4).map(function(s,idx){var a=state.orders.filter(function(o){return o.stage===idx});return '<section class="board-col"><h3>'+s+' <span>'+a.length+'</span></h3>'+(a.length?a.map(function(o){return '<article class="ticket"><div class="tiny">'+esc(o.id)+'</div><strong>'+esc(o.item)+'</strong><p>'+esc(o.name)+'<br>'+esc(o.details).slice(0,75)+'</p><button class="btn sm secondary" data-order="'+esc(o.id)+'">Ver detalhes</button><button class="btn sm violet" style="margin-top:8px" data-advance="'+esc(o.id)+'">Avançar etapa →</button></article>'}).join(""):'<p class="muted" style="text-align:center;font-size:11px;padding:35px 5px">Nenhuma peça nesta etapa</p>')+'</section>'}).join("")+'</div><div class="notice">Para testar: faça uma solicitação na vitrine, entre em Produção e avance a etapa. O andamento aparecerá no acompanhamento da vitrine no mesmo navegador.</div><section class="panel" style="margin-top:22px"><div class="panel-head"><h3>Concluídos</h3><span class="tag">Histórico de exemplo</span></div>'+state.orders.filter(function(o){return o.stage===4}).map(orderRow).join("")+(state.orders.some(function(o){return o.stage===4})?"":'<div class="empty">Pedidos concluídos aparecerão aqui.</div>')+'</section></div></main>'
}
function admin(){
var completed=state.orders.filter(function(o){return o.stage===4}).length;
return '<main class="dash"><div class="wrap"><div class="dash-title"><div><span class="eyebrow">Painel da gestão • Demo</span><h1>Mais visão. <span class="serif">Menos ruído.</span></h1><p class="subcopy">Centralize pedidos e decida o que aparece na vitrine, sem perder o toque artesanal. Indicadores calculados somente a partir de registros fictícios e locais.</p></div><button class="btn secondary" data-action="reset">Restaurar dados de exemplo ↺</button></div><div class="metrics"><div class="metric"><span>Solicitações no quadro</span><strong>'+state.orders.length+'</strong><small>Total da demonstração</small></div><div class="metric"><span>Em produção</span><strong>'+state.orders.filter(function(o){return o.stage===2}).length+'</strong><small>Etapa atual</small></div><div class="metric"><span>Concluídos</span><strong>'+completed+'</strong><small>Sem dados comerciais reais</small></div><div class="metric"><span>Criações visíveis</span><strong>'+state.visible.length+'/'+products.length+'</strong><small>Vitrine editável</small></div></div><div class="dash-grid"><div><section class="panel"><div class="panel-head"><h3>Solicitações recebidas</h3><button class="btn sm secondary" data-view="atelier">Ver quadro →</button></div>'+state.orders.slice().reverse().map(orderRow).join("")+'</section><section class="panel"><div class="panel-head"><h3>Personalizar a vitrine</h3><span class="tag">EDITÁVEL NA DEMO</span></div><p class="muted">Escolha quais exemplos de criações aparecem para quem acessa o ambiente Cliente.</p><div class="settings">'+products.map(function(p){return '<label class="toggle-row"><span><strong>'+esc(p.title)+'</strong><br><span class="muted">'+esc(p.cat)+'</span></span><input type="checkbox" data-visible="'+p.id+'" '+(state.visible.indexOf(p.id)>=0?"checked":"")+' aria-label="Exibir '+esc(p.title)+'"></label>'}).join("")+'</div></section></div><aside><div class="panel"><span class="eyebrow">Proposta de funcionamento</span><h3 style="margin-top:17px">O que muda no dia a dia?</h3><div class="list-row"><div><strong>Um briefing por pedido</strong><small>Referência, categoria e descrição reunidas.</small></div></div><div class="list-row"><div><strong>Fila de produção visual</strong><small>Atualização de etapas em poucos toques.</small></div></div><div class="list-row"><div><strong>Vitrine sempre organizada</strong><small>Controle do que pode ser solicitado.</small></div></div><button class="btn secondary" data-view="cliente" style="width:100%;margin-top:8px">Visualizar como cliente ↗</button></div><div class="mutebox"><strong style="color:var(--lime)">Sobre este protótipo</strong><p>Sem login real, banco de dados, recebimento de arquivos, envio de mensagens ou pagamento. Dados e alterações ficam apenas neste navegador; são simulações para apresentar a experiência.</p></div></aside></div></div></main>'
}
function render(preserve){document.title=(view==="cliente"?"Vitrine":view==="atelier"?"Produção":"Gestão")+" · Ateliê Conceito (DEMO)";document.getElementById("app").innerHTML=header()+(view==="cliente"?client():view==="atelier"?atelier():admin())+foot();if(!preserve)scrollTo({top:0,behavior:"instant"});}
function navigate(target){view=target;var u=new URL(location.href);u.searchParams.set("view",view);history.pushState({view:view},"",u.pathname+u.search);render();}
function openRequest(id){var p=products.find(function(x){return x.id===Number(id)});document.getElementById("overlay").innerHTML='<div class="modal-backdrop" data-close="outside"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><span class="eyebrow">Orçamento personalizado</span><h2 id="modal-title">Conte sua <span class="serif">ideia.</span></h2></div><button class="close" aria-label="Fechar formulário" data-close="yes">×</button></div><p class="muted" style="font-size:13px">Exemplo de formulário para organizar uma encomenda. O envio é simulado — nenhum dado chega ao negócio.</p><form id="brief"><div class="form-grid"><div class="field"><label for="nome">Como podemos chamar você?</label><input id="nome" name="nome" minlength="2" maxlength="60" required placeholder="Seu nome"></div><div class="field"><label for="tipo">Tipo de criação</label><select id="tipo" name="tipo" required>'+products.filter(function(x){return state.visible.indexOf(x.id)>=0}).map(function(x){return '<option value="'+esc(x.title)+'" '+(p&&p.id===x.id?"selected":"")+'>'+esc(x.title)+'</option>'}).join("")+'</select></div><div class="field full"><label for="descricao">O que você imagina?</label><textarea id="descricao" name="descricao" minlength="10" maxlength="500" required placeholder="Conte o personagem, as cores, a peça que precisa e outros detalhes..."></textarea><small>Detalhes ajudam o ateliê a avaliar materiais e prazo.</small></div><div class="field"><label for="prazo">Data desejada (opcional)</label><input id="prazo" name="prazo" type="date" min="2026-11-03"></div><div class="field"><label for="referencia">Referência (opcional)</label><input id="referencia" name="referencia" type="text" maxlength="100" placeholder="Ex.: personagem, série, inspiração"></div></div><div class="notice">Simulação: não envie dados sensíveis. Os campos ficam apenas no armazenamento deste navegador.</div><div class="form-actions"><button class="btn primary" type="submit">Criar solicitação de exemplo ↗</button><button class="btn secondary" type="button" data-close="yes">Cancelar</button></div></form></section></div>';document.getElementById("nome").focus();}
function detail(id){var o=state.orders.find(function(x){return x.id===id});if(!o)return;document.getElementById("overlay").innerHTML='<div class="modal-backdrop" data-close="outside"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="modal-head"><div><span class="eyebrow">'+esc(o.id)+'</span><h2 id="detail-title">'+esc(o.item)+'</h2></div><button class="close" aria-label="Fechar detalhes" data-close="yes">×</button></div><div class="list-row"><div><small>Cliente de exemplo</small><strong>'+esc(o.name)+'</strong></div>'+badge(o.stage)+'</div><div class="list-row"><div><small>Data de entrada</small><strong>'+dateBR(o.date)+'</strong></div></div><div class="list-row"><div><small>Detalhes informados</small><strong>'+esc(o.details)+'</strong></div></div><p class="muted">Todos os pedidos e dados são fictícios ou inseridos pelo visitante neste navegador.</p><div class="form-actions">'+(o.stage<4?'<button class="btn primary" data-advance="'+esc(o.id)+'">Avançar para '+esc(stages[o.stage+1])+' →</button>':'<span class="tag">PEDIDO CONCLUÍDO</span>')+'<button class="btn secondary" data-close="yes">Fechar</button></div></section></div>';document.querySelector(".close").focus();}
function toast(s){document.getElementById("toast").innerHTML='<div class="toast" role="status">'+esc(s)+'</div>';setTimeout(function(){document.getElementById("toast").innerHTML=""},3400)}
document.addEventListener("click",function(e){var t=e.target.closest("[data-view],[data-action],[data-filter],[data-advance],[data-order],[data-close]");if(!t)return;if(t.hasAttribute("data-view")){e.preventDefault();navigate(t.getAttribute("data-view"))}else if(t.hasAttribute("data-action")){var a=t.getAttribute("data-action");if(a==="request")openRequest(t.getAttribute("data-item"));if(a==="reset"){if(confirm("Restaurar os pedidos fictícios e as criações exibidas nesta demonstração?")){state=initial();save();render(true);toast("Dados de exemplo restaurados.")}}}else if(t.hasAttribute("data-filter")){filter=t.getAttribute("data-filter");render(true)}else if(t.hasAttribute("data-advance")){var o=state.orders.find(function(x){return x.id===t.getAttribute("data-advance")});if(o&&o.stage<4){o.stage++;save();document.getElementById("overlay").innerHTML="";render(true);toast("Pedido "+o.id+" atualizado: "+stages[o.stage])}}else if(t.hasAttribute("data-order"))detail(t.getAttribute("data-order"));else if(t.hasAttribute("data-close")){if(t.getAttribute("data-close")!=="outside"||e.target===t)document.getElementById("overlay").innerHTML=""}});
document.addEventListener("change",function(e){var t=e.target;if(!t.matches("[data-visible]"))return;var id=Number(t.getAttribute("data-visible"));state.visible=state.visible.filter(function(n){return n!==id});if(t.checked)state.visible.push(id);save();render(true);toast("Vitrine atualizada nesta demonstração.")});
document.addEventListener("submit",function(e){if(e.target.id!=="brief")return;e.preventDefault();var f=new FormData(e.target);var now=new Date();var n=state.orders.filter(function(o){return o.id.indexOf("DEMO-")===0}).length+1;var o={id:"DEMO-"+String(n).padStart(3,"0"),name:String(f.get("nome")).trim().slice(0,60),item:String(f.get("tipo")).slice(0,80),details:(String(f.get("descricao")).trim()+" "+(f.get("referencia")?" · Referência: "+String(f.get("referencia")).slice(0,80):"")+(f.get("prazo")?" · Desejo: "+dateBR(String(f.get("prazo"))):"")).slice(0,520),date:now.toISOString().slice(0,10),stage:0};state.orders.push(o);state.last=o.id;save();document.getElementById("overlay").innerHTML="";filter="Todos";navigate("cliente");toast("Solicitação de exemplo "+o.id+" criada!");});
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("overlay").innerHTML=""});
window.addEventListener("popstate",function(){view=new URL(location.href).searchParams.get("view")||"cliente";if(["cliente","atelier","admin"].indexOf(view)<0)view="cliente";render(true)});
render();
})();
</script></body></html>
