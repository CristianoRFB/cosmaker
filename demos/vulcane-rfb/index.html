document.getElementById("add-piece").addEventListener("click",function(){var id="PX-"+Math.random().toString(36).slice(2,8).toUpperCase();data.items.push({id:id,name:"Nova peça conceitual",kind:"Acessórios",desc:"Exemplo de peça artesanal. Edite esta descrição para a vitrine.",lead:"Prazo sob consulta",active:false,image:images.workshop});editing=id;save();render();notify("Peça criada em rascunho. Edite e marque disponível para mostrar na vitrine.")});
document.getElementById("delete-piece").addEventListener("click",function(){if(data.items.length<=1){notify("Mantenha ao menos uma peça de exemplo.");return}var p=byId(editing);if(!p)return;if(confirm("Excluir a peça de demonstração "+p.name+"? Os pedidos anteriores serão preservados para consulta.")){data.items=data.items.filter(function(x){return x.id!==editing});editing=data.items[0].id;if(picked===p.id)picked=editing;save();render();notify("Peça de demonstração excluída.")}});
document.querySelectorAll("[data-edit]").forEach(function(el){el.addEventListener("click",function(){editing=this.getAttribute("data-edit");render()})});
document.getElementById("edit-form").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(this),p=byId(editing);if(!p)return;var n=String(f.get("name")).trim(),d=String(f.get("desc")).trim(),l=String(f.get("lead")).trim();if(n.length<3||d.length<12||l.length<4){notify("Nome: 3+ caracteres, descrição: 12+, prazo: 4+.");return}p.name=n;p.kind=validKind(String(f.get("kind")));p.desc=d;p.lead=l;p.active=Boolean(f.get("active"));save();render();notify("Peça salva. Confira a vitrine do cliente.")});
document.querySelectorAll("[data-status]").forEach(function(el){el.addEventListener("change",function(){var code=this.getAttribute("data-status"),r=data.requests.find(function(x){return x.code===code});if(r){r.status=this.value;save();notify("Etapa salva. O cliente poderá consultar pelo código.")}})});
document.getElementById("reset-data").addEventListener("click",function(){if(confirm("Restaurar peças ilustrativas e apagar solicitações demo deste navegador?")){data=fresh();latest="";trackResult="";picked="P01";editing="P01";save();render();notify("Dados demonstrativos restaurados.")}});
}
}
function bindCopy(){var copy=document.getElementById("copy-brief");if(copy)copy.addEventListener("click",function(){var r=data.requests.find(function(x){return x.code===latest});if(!r)return;var txt="Briefing DEMO "+r.code+"\nPeça: "+r.pieceName+"\nPersonagem: "+r.character+"\nDetalhes: "+r.details+"\nQuando: "+r.when+"\nPorte: "+r.size+"\n(Não é pedido real.)";if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){notify("Resumo copiado.")}).catch(function(){notify("Cópia indisponível. Consulte os detalhes na gestão.")})}else{notify("Cópia indisponível neste navegador.")}})}
render();
})();
</script>
<script>
(function(){
  if(!new URL(location.href).searchParams.has("rfbqa"))return;
  var q={};
  try{
    var $=function(s){return document.querySelector(s)};
    q.home=!!$(".hero h1");
    q.slogan=document.body.textContent.includes("Melhor pra você, e pro cliente");
    q.ctas=$(".hero a[data-nav='/cliente']")!==null&&$(".hero a[data-nav='/gestao']")!==null;
    q.tables=document.querySelectorAll("table.compare").length===2;
    q.rows=Array.from(document.querySelectorAll("table.compare tbody")).map(function(x){return x.querySelectorAll("tr").length});
    q.price=document.body.textContent.includes("Orçamentos começam em R$ 100 mensais.");
    $(".hero a[data-nav='/gestao']").click();
    q.manage=location.pathname==="/gestao"&&!!$("#edit-form");
    $("#add-piece").click();
    q.create=!!$("#edit-form")&&$("#edit-name").value==="Nova peça conceitual";
    var newId=$(".admin-title .pill").textContent.replace(/^ID\s+/,"").trim();
    $("#edit-name").value="Arco de teste RFB";
    $("#edit-desc").value="Arco cenográfico de teste com medidas sob encomenda.";
    $("#edit-lead").value="Após avaliação";
    $("#edit-form").querySelector("input[name=active]").checked=true;
    $("#edit-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    $(".navlinks a[data-nav='/cliente']").click();
    q.public=Array.from(document.querySelectorAll(".product h3")).some(function(x){return x.textContent==="Arco de teste RFB"});
    var f=$("#brief-form");
    f.querySelector('select[name=piece]').value=newId;
    f.querySelector('input[name=character]').value="Personagem QA";
    f.querySelector('textarea[name=details]').value="Encomenda cenográfica de teste, sem dados pessoais.";
    f.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    var code=$("#created-result strong").textContent;
    q.request=code.startsWith("VX-");
    $(".navlinks a[data-nav='/gestao']").click();
    var select=document.querySelector('[data-status="'+code+'"]');
    q.inbox=!!select;
    if(select){select.value="Em análise";select.dispatchEvent(new Event("change",{bubbles:true}))}
    $(".navlinks a[data-nav='/cliente']").click();
    $("#lookup-code").value=code;
    $("#lookup-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    q.tracking=$("#lookup-result").textContent.includes("Em análise");
    $(".navlinks a[data-nav='/gestao']").click();
    var oldConfirm=window.confirm;
    window.confirm=function(){return true};
    $("#delete-piece").click();
    window.confirm=oldConfirm;
    $(".navlinks a[data-nav='/cliente']").click();
    q.delete=!Array.from(document.querySelectorAll(".product h3")).some(function(x){return x.textContent==="Arco de teste RFB"});
    q.overflow=document.documentElement.scrollWidth>innerWidth+1;
    q.width=innerWidth;
  }catch(e){q.error=String(e)}
  var out=document.createElement("section");
  out.id="rfb-qa-run";
  out.style.cssText="padding:32px;font-family:monospace;white-space:pre-wrap";
  out.textContent="RFB_QA_JSON "+JSON.stringify(q);
  document.getElementById("lookup-result").appendChild(out);
  try{localStorage.removeItem("77-vulcane-concept-v7-2026")}catch(e){}
})();
</script></body></html>
