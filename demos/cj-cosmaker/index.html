const statusList=['Recebido','Orçamento','Produção','Acabamento','Pronto'];const stageDesc=['Solicitação registrada','Análise e orçamento','Confecção da peça','Detalhes e acabamento','Pronto para entrega'];
const KEY='77-cj-cosmaker-demo-v2';const seed=[{id:'CJ-2401',name:'Projeto exemplo A',piece:'Máscara iluminada',category:'Máscaras',description:'Peça de referência fictícia para mostrar o acompanhamento.',status:'Produção',date:'2026-10-30',updates:[{date:'30/10',message:'Brief ilustrativo recebido para avaliação.'},{date:'31/10',message:'Materiais e proporções definidos (exemplo).'},{date:'01/11',message:'Estrutura cenográfica em execução (exemplo).'}]},{id:'CJ-2402',name:'Projeto exemplo B',piece:'Lâmina cenográfica',category:'Armas cenográficas',description:'Encomenda fictícia de espada para evento.',status:'Orçamento',date:'2026-10-29',updates:[{date:'29/10',message:'Referência recebida. Aguardando definição de tamanho.'}]},{id:'CJ-2403',name:'Projeto exemplo C',piece:'Escudo estilizado',category:'Armaduras',description:'Protótipo de fluxo com dados de teste.',status:'Acabamento',date:'2026-10-28',updates:[{date:'28/10',message:'Peça de demonstração cadastrada.'},{date:'31/10',message:'Pintura e detalhes ilustrativos em acabamento.'}]}];
function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(data&&Array.isArray(data.orders))return data}catch{}return {orders:structuredClone(seed)}}let db=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}save();
const $=s=>document.querySelector(s),app=$('#app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const code=s=>String(s).toUpperCase().trim();
function toast(text){const el=$('#toast-root');el.innerHTML=`<div class="toast">${safe(text)}</div>`;setTimeout(()=>{el.innerHTML=''},3000)}
function go(view){const next=view==='atelier'?'#atelier':'#'+view;if(location.hash===next){render()}else{location.hash=next}window.scrollTo({top:0,behavior:'instant'})}window.addEventListener('hashchange',render);
function hero(){return `<section class="container hero"><div><div class="eyebrow">CONCEITO DIGITAL PARA ATELIÊ DE COSPLAY</div><h1>Da ideia à <em>lenda.</em></h1><p>Armas cenográficas, máscaras, acessórios e armaduras. Um lugar para explorar possibilidades e começar uma encomenda do seu próximo personagem — sem perder o toque artesanal.</p><div class="hero-actions"><button class="btn btn-primary" data-go="encomenda">Imaginar minha peça <span aria-hidden="true">↗</span></button><a class="btn btn-outline" href="#portfolio" data-anchor="portfolio">Explorar portfólio ↓</a></div><div class="hero-footer"><span>01 / Peças personalizadas</span><span>02 / Processo criativo</span><span>03 / Acompanhamento</span></div></div><div class="hero-art"><div class="halo"></div><div class="art-svg">${art('mask','#e4a5db')}</div><div class="art-no">01 / 06</div><div class="art-tag">VISUAL CONCEITUAL • NÃO É FOTOGRAFIA DE PRODUTO</div></div></section>`}
function gallery(){const cats=['Todos','Máscaras','Armas cenográficas','Acessórios','Armaduras','Impressão 3D'];return `<section class="section section-dark" id="portfolio"><div class="container"><div class="section-head"><div><div class="eyebrow">O QUE PODE SER CRIADO</div><h2>Peças com<br> personalidade.</h2></div><p class="section-sub">Uma vitrine de categorias inspiradas no tipo de trabalho mostrado pelo perfil. As ilustrações são conceituais e não representam um catálogo oficial ou itens à venda.</p></div><div class="filter-row" role="group" aria-label="Filtrar categorias">${cats.map((c,i)=>`<button class="chip ${i===0?'active':''}" data-filter="${safe(c)}">${safe(c)}</button>`).join('')}</div><div class="gallery" id="gallery">${galleryItems('Todos')}</div></div></section>`}
function galleryItems(filter){return catalog.filter(p=>filter==='Todos'||filter===p.cat).map(p=>`<article class="piece"><div class="piece-visual" style="--glow:${p.glow}">${art(p.art,p.accent)}<span class="piece-kind">${safe(p.kind)}</span></div><div class="piece-info"><h3>${safe(p.name)}</h3><p>${safe(p.desc)}</p><div class="piece-foot"><span class="piece-note">SOB CONSULTA · EXEMPLO</span><button class="text-action" data-detail="${p.id}">Ver detalhes ↗</button></div></div></article>`).join('')}
function home(){return `${hero()}${gallery()}<section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">DO PRIMEIRO ESBOÇO À PEÇA FINAL</div><h2>Como funcionaria.</h2></div></div><div class="process"><div><span class="step-no">01 / REFERÊNCIA</span><h3>Conte sua ideia.</h3><p>Escolha a categoria, explique qual personagem ou peça você imaginou e reúna referências.</p></div><div><span class="step-no">02 / CONVERSA</span><h3>Alinhe os detalhes.</h3><p>O ateliê analisa tamanho, acabamento e complexidade antes de apresentar um orçamento real.</p></div><div><span class="step-no">03 / ACOMPANHAMENTO</span><h3>Veja ganhar forma.</h3><p>Uma área exclusiva permitiria consultar o andamento e receber atualizações da fabricação.</p></div></div></div></section><section class="section"><div class="container"><div class="banner"><div><div class="eyebrow" style="color:#633850">O PRÓXIMO PROJETO COMEÇA COM UMA IDEIA</div><h2>Qual peça você criaria?</h2><p>Teste o fluxo de encomenda e veja como um pedido apareceria no painel de gestão. Nenhum dado é enviado ao ateliê.</p></div><button class="btn" data-go="encomenda">Simular orçamento ↗</button></div></div></section>`}
function enquiry(){return `<section class="screen container"><div class="intro"><div><div class="eyebrow">VISÃO 01 · CLIENTE</div><h2>Sua ideia, em detalhes.</h2><p>Simule um pedido de orçamento personalizado. Este formulário é demonstrativo, sem envio de mensagens, fotos ou dados ao ateliê.</p></div></div><div class="layout-two"><div class="sheet"><form id="quote-form"><h3>Vamos entender a peça.</h3><div class="fields"><div class="field"><label for="piece">Tipo de peça *</label><select id="piece" name="piece" required><option value="">Selecione uma categoria</option>${['Máscaras','Armas cenográficas','Acessórios','Armaduras','Impressão 3D','Outro projeto'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="ref">Personagem / referência *</label><input id="ref" name="ref" maxlength="90" required placeholder="Ex.: personagem de um jogo"></div><div class="field full"><label for="desc">Descreva a peça que você imagina *</label><textarea id="desc" name="desc" required minlength="10" maxlength="600" placeholder="Tamanho aproximado, detalhes importantes, acabamento, cores..."></textarea><small>Não insira dados pessoais. Use informações fictícias neste teste.</small></div><div class="field"><label for="size">Tamanho aproximado</label><select id="size" name="size"><option value="Ainda não sei">Ainda não sei</option><option>Pequeno (até 30 cm)</option><option>Médio (30–80 cm)</option><option>Grande (mais de 80 cm)</option><option>Sob medida</option></select></div><div class="field"><label for="date">Data desejada (opcional)</label><input id="date" name="date" type="date"></div><div class="field full"><label for="finish">Acabamento</label><select id="finish" name="finish"><option>Quero sugestões</option><option>Pintura e detalhes</option><option>Textura metálica</option><option>Peça para impressão 3D</option></select></div></div><div class="form-foot"><div class="privacy-note">Ao continuar, este navegador criará um pedido de teste. A solicitação fica salva apenas neste dispositivo, sem comunicação com a CJ Cosmaker.</div><button class="btn btn-primary" type="submit">Criar pedido de demonstração ↗</button></div></form></div><aside class="side-card"><div class="eyebrow">ATENDIMENTO PERSONALIZADO</div><h3>Sem preços engessados.</h3><p>Peças artesanais variam por tamanho, técnica, material e acabamento. Por isso, a proposta valoriza um orçamento individual.</p><ol><li>Você conta qual personagem ou acessório quer criar.</li><li>O ateliê avalia o projeto e combina os detalhes.</li><li>Na versão contratada, o cliente receberia atualizações de produção.</li></ol><div class="inline-note">Demonstração técnica: sem pagamento, sem upload, sem orçamento real.</div></aside></div></section>`}
function tracking(){return `<section class="screen container"><div class="intro"><div><div class="eyebrow">VISÃO 02 · ACOMPANHAMENTO</div><h2>Da bancada até você.</h2><p>Digite um código de demonstração para acompanhar o estágio da peça. Experimente <strong>CJ-2401</strong> ou o código gerado na simulação.</p></div></div><form class="tracking-form" id="track-form"><label class="sr-only" for="tracking-code">Código do pedido</label><input id="tracking-code" class="track-input" placeholder="CJ-2401" maxlength="14" autocomplete="off" required><button class="btn btn-primary">Consultar andamento ↗</button></form><p class="mini-notice">Os códigos e atualizações abaixo são fictícios. A consulta não acessa encomendas reais nem o Instagram.</p><div id="tracking-result"></div></section>`}
function trackCard(order){const i=Math.max(0,statusList.indexOf(order.status));return `<article class="track-result"><div class="track-top"><div><span class="eyebrow">PEDIDO ${safe(order.id)} · EXEMPLO</span><h3>${safe(order.piece)}</h3><span class="muted">${safe(order.category)} · ${safe(order.name)}</span></div><span class="pill">${safe(order.status)}</span></div><div class="progress-steps" aria-label="Andamento da produção">${statusList.map((s,j)=>`<div class="progress-step ${j<=i?'done':''}" aria-label="${safe(s)}: ${j<=i?'concluído ou em andamento':'pendente'}">${safe(stageDesc[j])}</div>`).join('')}</div><hr class="line-divider"><div class="eyebrow">REGISTRO DE ATUALIZAÇÕES</div><div class="updates">${order.updates.slice().reverse().map(u=>`<div class="update"><b>${safe(u.date)}</b> · <span>${safe(u.message)}</span></div>`).join('')||'<div class="update">Aguardando atualização da produção (simulada).</div>'}</div><div class="modal-actions"><button class="btn btn-dark btn-small" data-go="atelier">Voltar ao portfólio</button><button class="btn btn-outline btn-small" data-go="gestao">Testar painel da gestão ↗</button></div></article>`}
function metrics(){return {total:db.orders.length,progress:db.orders.filter(o=>['Produção','Acabamento'].includes(o.status)).length,ready:db.orders.filter(o=>o.status==='Pronto').length}}
function dashboard(){const m=metrics();return `<section class="screen container"><div class="admin-header"><div><div class="eyebrow">VISÃO 03 · PAINEL DE ATELIÊ · ACESSO LIVRE APENAS NA DEMO</div><h2>Oficina em movimento.</h2><p class="muted">Gerencie a fila de encomendas, altere estágios e adicione atualizações. Somente dados locais e fictícios.</p></div><button class="btn btn-outline btn-small" data-reset>Restaurar dados de exemplo</button></div><div class="stats"><div class="stat"><small>Pedidos na demonstração</small><strong>${m.total}</strong></div><div class="stat"><small>Em fabricação / acabamento</small><strong>${m.progress}</strong></div><div class="stat"><small>Prontos para entrega</small><strong>${m.ready}</strong></div></div><div class="admin-tools"><div class="eyebrow">FLUXO DE PRODUÇÃO</div><input class="track-input" id="admin-search" aria-label="Buscar pedido" placeholder="Buscar código, peça ou referência"></div><div class="kanban" id="kanban">${kanban('')}</div><p class="mini-notice" style="margin-top:20px">Esta tela não exige login porque é uma simulação isolada no navegador. Em um sistema contratado, o painel seria protegido por autenticação e permissões.</p></section>`}
function kanban(query){const stages=[{name:'Entrada & orçamento',statuses:['Recebido','Orçamento']},{name:'Em produção',statuses:['Produção']},{name:'Acabamento',statuses:['Acabamento']},{name:'Finalizados',statuses:['Pronto']}];const q=query.toLowerCase().trim();return stages.map(s=>{const arr=db.orders.filter(o=>s.statuses.includes(o.status)&&[o.id,o.name,o.piece,o.category].join(' ').toLowerCase().includes(q));return `<div class="column"><div class="column-head">${s.name}<span>${arr.length}</span></div>${arr.map(o=>`<article class="task"><small>${safe(o.id)} · ${safe(o.category)}</small><h4>${safe(o.piece)}</h4><p>${safe(o.name)}</p><label class="sr-only" for="st-${safe(o.id)}">Etapa do pedido ${safe(o.id)}</label><select data-status="${safe(o.id)}" id="st-${safe(o.id)}">${statusList.map(st=>`<option ${o.status===st?'selected':''}>${st}</option>`).join('')}</select><button class="btn btn-dark btn-small" data-update="${safe(o.id)}">Registrar atualização</button><button class="text-action" data-track="${safe(o.id)}">Ver como cliente ↗</button></article>`).join('')||'<p class="empty-col">Sem pedidos nesta etapa</p>'}</div>`}).join('')}
function detailModal(item){$('#modal-root').innerHTML=`<div class="modal-backdrop" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="${safe(item.name)}"><div class="modal-content"><div class="modal-top"><span class="eyebrow">PEÇA DE REFERÊNCIA · CONCEITO</span><button class="close" data-close aria-label="Fechar">×</button></div><div class="modal-art">${art(item.art,item.accent)}</div><h3>${safe(item.name)}</h3><p>${safe(item.desc)} Esta ilustração foi criada exclusivamente para apresentar uma possibilidade de navegação; não retrata encomenda ou produto oficial.</p><div class="modal-actions"><button class="btn btn-primary" data-use="${item.id}">Usar como inspiração ↗</button><button class="btn btn-dark" data-close>Continuar explorando</button></div></div></div></div>`;$('.close')?.focus()}
function updateModal(id){const o=db.orders.find(x=>x.id===id);if(!o)return;$('#modal-root').innerHTML=`<div class="modal-backdrop" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="Registrar atualização"><div class="modal-content"><div class="modal-top"><span class="eyebrow">DIÁRIO DE PRODUÇÃO · ${safe(id)}</span><button class="close" data-close aria-label="Fechar">×</button></div><h3>Uma atualização para ${safe(o.piece)}</h3><p>Escreva uma nota demonstrativa. Ela aparecerá na visão de acompanhamento deste mesmo navegador.</p><form id="update-form" data-id="${safe(id)}"><div class="field"><label for="update-text">Nota de progresso *</label><textarea id="update-text" name="message" required minlength="5" maxlength="300" placeholder="Ex.: Detalhes da pintura concluídos (exemplo)."></textarea></div><div class="modal-actions"><button class="btn btn-primary" type="submit">Salvar nota de demonstração</button><button type="button" class="btn btn-dark" data-close>Cancelar</button></div></form></div></div></div>`;$('#update-text').focus()}
function render(){const page=location.hash.replace('#','')||'atelier';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===page));app.innerHTML=page==='encomenda'?enquiry():page==='acompanhar'?tracking():page==='gestao'?dashboard():home();if(page==='acompanhar'){$('#tracking-code').value=sessionStorage.getItem('cj-track')||'CJ-2401';showTracking($('#tracking-code').value)}if(page==='encomenda'&&sessionStorage.getItem('cj-selected')){const v=sessionStorage.getItem('cj-selected');$('#piece').value=v;sessionStorage.removeItem('cj-selected')}}
function showTracking(v){const order=db.orders.find(x=>x.id===code(v));$('#tracking-result').innerHTML=order?trackCard(order):`<div class="track-result"><strong>Não encontramos este código de demonstração.</strong><p class="muted">Tente CJ-2401 ou crie um pedido na área de orçamento deste navegador.</p></div>`}
function quote(form){const data=new FormData(form);const id='CJ-'+String(1000+Math.floor(Math.random()*8999));const entry={id,name:'Visitante (demo)',piece:String(data.get('ref')).trim().slice(0,90),category:String(data.get('piece')),description:String(data.get('desc')).trim(),size:String(data.get('size')),date:String(data.get('date'))||'',finish:String(data.get('finish')),status:'Recebido',updates:[{date:new Date().toLocaleDateString('pt-BR'),message:'Solicitação demonstrativa recebida. Nenhuma informação foi enviada ao ateliê.'}]};if(db.orders.some(o=>o.id===id))return quote(form);db.orders.unshift(entry);save();sessionStorage.setItem('cj-track',id);app.innerHTML=`<section class="screen container"><div class="success-box"><div class="eyebrow" style="color:var(--lime)">SIMULAÇÃO CONCLUÍDA</div><h3>Seu projeto de exemplo entrou na fila.</h3><p>Esse é o funcionamento de uma possível solicitação de orçamento. O pedido existe somente neste navegador e não foi encaminhado à CJ Cosmaker.</p><div class="order-code">${id}</div><div class="modal-actions"><button class="btn btn-primary" data-go="acompanhar">Acompanhar a demonstração ↗</button><button class="btn btn-outline" data-go="gestao">Ver no painel de gestão</button></div></div></section>`;window.scrollTo(0,0)}
document.addEventListener('submit',e=>{if(e.target.id==='quote-form'){e.preventDefault();quote(e.target)}if(e.target.id==='track-form'){e.preventDefault();sessionStorage.setItem('cj-track',$('#tracking-code').value);showTracking($('#tracking-code').value)}if(e.target.id==='update-form'){e.preventDefault();const id=e.target.dataset.id;const o=db.orders.find(o=>o.id===id);if(o){o.updates.push({date:new Date().toLocaleDateString('pt-BR'),message:new FormData(e.target).get('message').toString().trim()});save();$('#modal-root').innerHTML='';toast('Atualização visível no acompanhamento');render()}}});
document.addEventListener('click',e=>{const target=e.target.closest('[data-go],[data-detail],[data-filter],[data-use],[data-close],[data-reset],[data-track],[data-update]');if(!target)return;if(target.dataset.go){e.preventDefault();go(target.dataset.go)}else if(target.dataset.detail){detailModal(catalog.find(x=>x.id===target.dataset.detail))}else if(target.dataset.filter){document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b===target));$('#gallery').innerHTML=galleryItems(target.dataset.filter)}else if(target.dataset.use){const p=catalog.find(x=>x.id===target.dataset.use);sessionStorage.setItem('cj-selected',p.cat);$('#modal-root').innerHTML='';go('encomenda')}else if('close' in target.dataset){if(target.classList.contains('modal-backdrop')&&e.target!==target)return;$('#modal-root').innerHTML=''}else if('reset' in target.dataset){if(confirm('Restaurar pedidos fictícios originais neste navegador?')){db={orders:structuredClone(seed)};save();render();toast('Exemplos restaurados')}}else if(target.dataset.track){sessionStorage.setItem('cj-track',target.dataset.track);go('acompanhar')}else if(target.dataset.update){updateModal(target.dataset.update)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-status]')){const o=db.orders.find(x=>x.id===e.target.dataset.status);if(o){o.status=e.target.value;o.updates.push({date:new Date().toLocaleDateString('pt-BR'),message:`Etapa alterada para ${o.status} (demonstração).`});save();const q=$('#admin-search')?.value||'';render();if($('#admin-search')){$('#admin-search').value=q;$('#kanban').innerHTML=kanban(q)}toast('Etapa atualizada')}}});document.addEventListener('input',e=>{if(e.target.id==='admin-search')$('#kanban').innerHTML=kanban(e.target.value)});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal-root').innerHTML=''});render();
</script>
</body></html>
